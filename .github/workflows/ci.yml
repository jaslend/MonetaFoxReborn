name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, lint, test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile=false

      - name: Lint
        run: corepack pnpm run lint

      - name: Typecheck
        run: corepack pnpm run typecheck

      - name: Unit / component tests with coverage
        run: corepack pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage
          retention-days: 7

      - name: Build
        run: corepack pnpm run build

      - name: Verify PWA artifacts
        run: |
          test -f dist/manifest.webmanifest
          # vite-plugin-pwa emits a non-empty workbox service worker. (SW
          # registration lives in the app bundle via virtual:pwa-register/react,
          # so there is intentionally no standalone dist/registerSW.js.)
          test -s dist/sw.js
          grep -qE "workbox|precache" dist/sw.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile=false

      - name: Install Playwright browsers (with deps)
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: corepack pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
